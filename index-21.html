<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>太陽專業清洗 — 月結單系統</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--blue:#1565C0;--blue2:#E3F2FD;--gold:#F9A825;--goldbg:#FFFDE7;--green:#2E7D32;--greenbg:#E8F5E9;--red:#C62828;--redbg:#FFEBEE;--gray:#546E7A;--graybg:#ECEFF1;--bg:#F5F7FA;--border:#CFD8DC;--text:#1A2332;--text2:#546E7A;--r:10px}
body{font-family:'PingFang TC','Microsoft JhengHei',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
.fullscreen{display:flex;align-items:center;justify-content:center;min-height:100vh;background:linear-gradient(135deg,#0D47A1,#1976D2)}
.centrecard{background:#fff;border-radius:20px;padding:44px 38px;width:min(400px,92vw);box-shadow:0 20px 60px rgba(0,0,0,.3);text-align:center}
.ltabs{display:flex;border:1.5px solid #CFD8DC;border-radius:8px;margin-bottom:24px;overflow:hidden}
.ltab{flex:1;padding:10px;font-size:13px;font-weight:500;cursor:pointer;background:#fff;border:none;color:#546E7A;font-family:inherit}
.ltab.on{background:var(--blue);color:#fff}
.linput{width:100%;padding:11px 14px;border:1.5px solid #CFD8DC;border-radius:8px;font-size:14px;margin-bottom:14px;font-family:inherit;outline:none}
.lbtn{width:100%;padding:12px;background:var(--blue);color:#fff;border:none;border-radius:8px;font-size:15px;font-weight:600;cursor:pointer;font-family:inherit}
.lerr{color:var(--red);font-size:13px;margin-top:8px;min-height:18px}
#appWrap{display:none;flex-direction:column;min-height:100vh}
.topbar{background:var(--blue);color:#fff;height:56px;padding:0 24px;display:flex;align-items:center;justify-content:space-between}
.topbar-brand{font-size:16px;font-weight:700}
.topbar-brand small{opacity:.7;font-size:12px;font-weight:400;margin-left:6px}
.syncbadge{font-size:11px;padding:3px 10px;border-radius:12px}
.s-ok{background:rgba(46,125,50,.35);color:#A5D6A7}
.s-err{background:rgba(198,40,40,.35);color:#EF9A9A}
.s-ing{background:rgba(255,255,255,.15);color:rgba(255,255,255,.85)}
.logoutbtn{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.3);color:#fff;padding:5px 12px;border-radius:6px;font-size:12px;cursor:pointer;font-family:inherit}
.main{display:flex;flex:1}
.sidebar{width:200px;background:#fff;border-right:1px solid var(--border);padding:14px 10px;flex-shrink:0}
.nsec{font-size:10px;font-weight:700;color:#90A4AE;letter-spacing:.8px;padding:10px 10px 4px;text-transform:uppercase}
.navbtn{display:block;width:100%;text-align:left;padding:9px 12px;border-radius:7px;font-size:13px;cursor:pointer;border:none;background:none;color:var(--text2);font-weight:500;font-family:inherit}
.navbtn:hover{background:var(--graybg)}
.navbtn.on{background:var(--blue2);color:var(--blue)}
.content{flex:1;padding:24px;overflow-y:auto}
.page{display:none}.page.on{display:block}
.ptitle{font-size:20px;font-weight:700;margin-bottom:6px}
.psub{font-size:13px;color:var(--text2);margin-bottom:20px}
.card{background:#fff;border:1px solid var(--border);border-radius:var(--r);padding:20px;box-shadow:0 2px 8px rgba(0,0,0,.06);margin-bottom:16px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.flabel{font-size:12px;font-weight:600;color:var(--text);margin-bottom:5px;display:block}
.finput{width:100%;padding:9px 12px;border:1.5px solid var(--border);border-radius:7px;font-size:13px;font-family:inherit;outline:none}
.finput:focus{border-color:var(--blue)}
.fsel{width:100%;padding:9px 12px;border:1.5px solid var(--border);border-radius:7px;font-size:13px;font-family:inherit;outline:none;background:#fff}
.btn{display:inline-flex;align-items:center;gap:6px;padding:9px 18px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;border:none;font-family:inherit}
.btn-blue{background:var(--blue);color:#fff}
.btn-out{background:#fff;color:var(--blue);border:1.5px solid var(--blue)}
.btn-red{background:var(--redbg);color:var(--red);border:1px solid #FFCDD2;padding:5px 11px;font-size:12px;cursor:pointer;border-radius:6px;font-family:inherit}
.btn-green{background:var(--greenbg);color:var(--green);border:1px solid #C8E6C9;padding:5px 11px;font-size:12px;font-weight:600;cursor:pointer;border-radius:6px;font-family:inherit}
.badge{display:inline-block;padding:2px 9px;border-radius:12px;font-size:10px;font-weight:600}
.bb{background:var(--blue2);color:var(--blue)}.by{background:var(--goldbg);color:#7B6000}
.bo{background:#FFF3E0;color:#E65100}.bp{background:#F3E5F5;color:#6A1B9A}
table{width:100%;border-collapse:collapse;font-size:12px}
th{background:#F0F4F8;padding:9px 12px;text-align:left;font-weight:600;color:var(--text2);border-bottom:2px solid var(--border)}
td{padding:8px 12px;border-bottom:1px solid var(--graybg);vertical-align:middle}
.statgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}
.statcard{background:#fff;border:1px solid var(--border);border-radius:var(--r);padding:14px 16px}
.stlabel{font-size:11px;color:var(--text2);margin-bottom:4px}
.stval{font-size:22px;font-weight:700;color:var(--blue)}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.ccard{background:#fff;border:1px solid var(--border);border-radius:var(--r);padding:16px;cursor:pointer;transition:all .2s;position:relative}
.ccard:hover{border-color:var(--blue);box-shadow:0 4px 16px rgba(21,101,192,.12)}
.mbar{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--border);border-radius:var(--r);padding:13px 16px;margin-bottom:18px;flex-wrap:wrap}
.px-row{display:flex;align-items:center;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--graybg)}
.px-row:last-child{border-bottom:none}
.px-inp{width:80px;padding:5px 8px;border:1.5px solid var(--border);border-radius:6px;font-size:13px;text-align:center;font-family:inherit;outline:none}
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:1000;align-items:center;justify-content:center}
.overlay.on{display:flex}
.modal{background:#fff;border-radius:14px;padding:20px;width:min(720px,96vw);max-height:90vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.modal-sm{background:#fff;border-radius:14px;padding:28px;width:min(520px,92vw);max-height:90vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.inv{border:1px solid var(--border);border-radius:8px;overflow:hidden}
.invh{background:var(--blue);color:#fff;padding:20px 28px;display:flex;justify-content:space-between;align-items:flex-start}
.invb{padding:22px 28px}
.invt{width:100%;border-collapse:collapse;font-size:11px}
.invt th{background:#F0F4F8;padding:7px 8px;text-align:left;font-weight:600;color:var(--text2);border-bottom:2px solid var(--border)}
.invt td{padding:5px 8px;border-bottom:1px solid var(--graybg)}
.sumt{width:100%;border-collapse:collapse;font-size:11px;margin-top:10px}
.sumt th{background:var(--blue);color:#fff;padding:6px 9px}
.sumt td{padding:5px 9px;border-bottom:1px solid var(--graybg)}
.totbox{margin-top:14px;padding:13px 18px;background:var(--goldbg);border:2px solid var(--gold);border-radius:7px;display:flex;justify-content:space-between;align-items:center}
</style>
</head>
<body>

<div id="loginWrap" class="fullscreen">
  <div class="centrecard">
    <div style="font-size:36px;font-weight:700;color:var(--blue);margin-bottom:6px">S</div>
    <div style="font-size:20px;font-weight:700;color:var(--blue);margin-bottom:3px">太陽專業清洗</div>
    <div style="font-size:12px;color:var(--text2);margin-bottom:26px">SUNNY PROFESSIONAL CLEANING</div>
    <div class="ltabs">
      <button class="ltab on" id="tboss" onclick="setRole('boss')">老闆登入</button>
      <button class="ltab" id="tstaff" onclick="setRole('staff')">員工登入</button>
    </div>
    <input class="linput" type="password" id="pw" placeholder="輸入密碼" onkeydown="if(event.key==='Enter')login()">
    <button class="lbtn" onclick="login()">登入系統</button>
    <div class="lerr" id="lerr"></div>
    <div id="loginHint" style="margin-top:12px;font-size:11px;color:#90A4AE"></div>
  </div>
</div>

<div id="appWrap">
  <div class="topbar">
    <div class="topbar-brand">太陽專業清洗<small>月結單系統</small></div>
    <div style="display:flex;align-items:center;gap:10px">
      <span class="syncbadge s-ing" id="syncBadge">連接中</span>
      <span class="syncbadge" id="rbadge" style="background:rgba(255,255,255,.18);color:#fff"></span>
      <button class="logoutbtn" onclick="logout()">登出</button>
    </div>
  </div>
  <div class="main">
    <div class="sidebar">
      <div class="nsec">功能</div>
      <button class="navbtn on" id="n-entry" onclick="go('entry')">每日數量輸入</button>
      <button class="navbtn" id="n-summary" onclick="go('summary')" style="display:none">月結單總覽</button>
      <button class="navbtn" id="n-generate" onclick="go('generate')" style="display:none">生成PDF收據</button>
      <button class="navbtn" id="n-prices" onclick="go('prices')" style="display:none">單價管理</button>
      <div class="nsec">系統</div>
      <button class="navbtn" id="n-settings" onclick="go('settings')" style="display:none">設定</button>
    </div>
    <div class="content">

      <!-- ENTRY -->
      <div class="page on" id="p-entry">
        <div class="ptitle">每日數量輸入</div>
        <div class="psub">選擇客戶和日期，輸入各類毛巾數量</div>
        <div class="card">
          <div class="row2" style="margin-bottom:14px">
            <div><label class="flabel">選擇客戶</label>
              <select class="fsel" id="eClient" onchange="loadTable()"><option value="">-- 請選擇 --</option></select></div>
            <div><label class="flabel">日期</label>
              <input class="finput" type="date" id="eDate"></div>
          </div>
          <div style="margin-bottom:14px">
            <label class="flabel">貨單編號（可選）</label>
            <input class="finput" type="text" id="eRef" placeholder="例: 767" style="max-width:180px">
          </div>
          <div id="etArea" style="display:none">
            <div style="overflow-x:auto;margin-bottom:14px"><table id="etTable"></table></div>
            <!-- Extra custom items -->
            <div style="margin-bottom:14px;background:#F8F9FA;border-radius:8px;padding:14px;border:1px solid #E0E0E0">
              <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
                <div style="font-size:13px;font-weight:600;color:#546E7A">其他品項（特別清洗）</div>
                <div id="extraPriceNote" style="font-size:11px;color:#1565C0;display:none">老闆模式：新品項需填單價</div>
              </div>
              <div id="extraItemsList"></div>
              <button type="button" onclick="addExtraItem()" style="background:none;border:1.5px dashed #90A4AE;color:#546E7A;padding:7px 16px;border-radius:7px;font-size:13px;cursor:pointer;font-family:inherit;margin-top:6px">＋ 增加品項</button>
            </div>
            <button class="btn btn-blue" onclick="saveEntry()" id="saveEntryBtn">儲存記錄</button>
          </div>
        </div>
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;flex-wrap:wrap;gap:8px">
          <div style="font-size:14px;font-weight:700">記錄查詢與修改</div>
          <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
            <select id="filterClient" onchange="renderRecent()" style="padding:6px 10px;border:1.5px solid #CFD8DC;border-radius:7px;font-size:12px;font-family:inherit;outline:none">
              <option value="">所有客戶</option>
            </select>
            <input type="month" id="filterMonth" onchange="renderRecent()" style="padding:6px 10px;border:1.5px solid #CFD8DC;border-radius:7px;font-size:12px;font-family:inherit;outline:none">
            <button onclick="document.getElementById('filterClient').value='';document.getElementById('filterMonth').value='';renderRecent()" style="padding:6px 10px;border:1px solid #CFD8DC;border-radius:7px;font-size:12px;background:#fff;cursor:pointer;font-family:inherit">清除篩選</button>
            <button id="batchDelBtn" onclick="batchDel(this)" style="padding:6px 12px;border:1px solid #FFCDD2;border-radius:7px;font-size:12px;background:#FFEBEE;color:#C62828;cursor:pointer;font-family:inherit;font-weight:600">批量刪除篩選結果</button>
          </div>
        </div>
        <div class="card" style="padding:0;overflow:hidden">
          <div style="overflow-x:auto">
            <table><thead><tr><th>日期</th><th>客戶</th><th>貨單</th><th>總量</th><th>來源</th><th>操作</th></tr></thead>
            <tbody id="recentTb"></tbody></table>
          </div>
        </div>
      </div>

      <!-- SUMMARY -->
      <div class="page" id="p-summary">
        <div class="ptitle">月結單總覽</div>
        <div class="psub">各客戶當月金額</div>
        <div class="mbar">
          <span style="font-size:13px;font-weight:600;color:var(--text2)">月份：</span>
          <input class="finput" type="month" id="sumMonth" style="width:155px" onchange="renderSum()">
        </div>
        <div class="statgrid" id="sumStats"></div>
        <div class="cgrid" id="sumGrid"></div>
      </div>

      <!-- GENERATE -->
      <div class="page" id="p-generate">
        <div class="ptitle">生成PDF收據</div>
        <div class="psub">預覽並下載各客戶收據</div>
        <div class="mbar">
          <span style="font-size:13px;font-weight:600;color:var(--text2)">月份：</span>
          <input class="finput" type="month" id="genMonth" style="width:155px" onchange="renderGen()">
          <button class="btn btn-blue" style="margin-left:auto" onclick="dlAll()">全部下載</button>
        </div>
        <div class="cgrid" id="genGrid"></div>
      </div>

      <!-- PRICES -->
      <div class="page" id="p-prices">
        <div class="ptitle">單價管理</div>
        <div class="psub">各客戶毛巾單價（老闆可修改）</div>
        <div id="priceList"></div>
      </div>

      <!-- SETTINGS -->
      <div class="page" id="p-settings">
        <div class="ptitle">系統設定</div>
        <div class="psub">管理雲端連接</div>
        <div class="card">
          <div style="font-size:14px;font-weight:700;margin-bottom:12px">Google Apps Script 網址</div>
          <input class="finput" type="text" id="settingsUrl" style="margin-bottom:10px">
          <div style="display:flex;gap:10px;margin-bottom:10px">
            <button class="btn btn-blue" onclick="saveUrl(this)">儲存並測試</button>
            <button class="btn btn-out" onclick="go('entry')">取消</button>
          </div>
          <div id="urlMsg" style="font-size:13px;min-height:18px"></div>
        </div>
        <div class="card">
          <div style="font-size:14px;font-weight:700;margin-bottom:8px">清除重複記錄</div>
          <div style="font-size:13px;color:var(--text2);margin-bottom:10px">自動保留每個客戶每天第一條記錄，刪除重複</div>
          <button class="btn btn-blue" onclick="dedup(this)">清除重複記錄</button>
          <div id="dedupMsg" style="font-size:13px;margin-top:8px;min-height:18px"></div>
        </div>
        <div class="card" style="margin-bottom:16px">
          <div style="font-size:14px;font-weight:700;margin-bottom:8px">新增合作店舖</div>
          <div style="font-size:13px;color:var(--text2);margin-bottom:12px">新增後會出現在客戶選單，員工可以輸入數量</div>
          <div class="row2" style="margin-bottom:10px">
            <div><label class="flabel">店舖名稱</label><input class="finput" type="text" id="newClientName" placeholder="例：新店舖"></div>
            <div><label class="flabel">類型</label>
              <select class="fsel" id="newClientType">
                <option value="cn">月結單（中文）</option>
                <option value="inv">Invoice（英文）</option>
              </select>
            </div>
          </div>
          <div style="margin-bottom:10px">
            <label class="flabel">品項（用逗號分隔）</label>
            <input class="finput" type="text" id="newClientCols" placeholder="例：大毛巾,細毛巾,浴袍">
          </div>
          <div id="newClientInvFields" style="display:none;margin-bottom:10px">
            <div class="row2">
              <div><label class="flabel">Invoice 編號</label><input class="finput" type="text" id="newClientInvNo" placeholder="例：029"></div>
              <div><label class="flabel">收款公司名稱</label><input class="finput" type="text" id="newClientBillTo" placeholder="例：XXX有限公司"></div>
            </div>
          </div>
          <button class="btn btn-blue" style="width:auto;padding:9px 20px" onclick="addNewClient()">新增店舖</button>
          <div id="newClientMsg" style="font-size:13px;margin-top:8px;min-height:18px"></div>
        </div>
        <div class="card">
          <div style="font-size:14px;font-weight:700;margin-bottom:14px;color:var(--red)">危險操作</div>
          <button class="btn" style="background:var(--redbg);color:var(--red);border:1px solid #FFCDD2" onclick="if(confirm('確定清除？')){localStorage.removeItem('sunny_gas_url');location.reload();}">清除雲端網址（重新設定）</button>
        </div>
      </div>

    </div>
  </div>
</div>

<!-- EDIT MODAL -->
<div class="overlay" id="editOverlay">
  <div class="modal-sm">
    <div style="font-size:16px;font-weight:700;margin-bottom:4px">修改記錄數量</div>
    <div style="font-size:12px;color:var(--text2);margin-bottom:16px" id="editDesc"></div>
    <div style="margin-bottom:14px">
      <label class="flabel">貨單編號</label>
      <input class="finput" type="text" id="editRef" style="max-width:180px">
    </div>
    <div style="overflow-x:auto;margin-bottom:18px"><table id="editTable"></table></div>
    <div style="display:flex;gap:10px;justify-content:flex-end">
      <button class="btn btn-out" onclick="closeEdit()">取消</button>
      <button class="btn btn-blue" onclick="saveEdit(this)">儲存修改</button>
    </div>
  </div>
</div>

<!-- PREVIEW MODAL -->
<div class="overlay" id="prevOverlay">
  <div class="modal">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">
      <div style="font-size:16px;font-weight:700" id="prevTitle">預覽</div>
      <div style="display:flex;gap:8px">
        <button class="btn btn-blue" onclick="dlPDF()">下載PDF</button>
        <button class="btn btn-out" onclick="closePrev()">關閉</button>
      </div>
    </div>
    <div id="prevArea"></div>
  </div>
</div>

<!-- PRICE MODAL -->
<div class="overlay" id="pxOverlay">
  <div class="modal-sm">
    <div style="font-size:16px;font-weight:700;margin-bottom:8px">單價已修改</div>
    <div style="font-size:13px;color:var(--text2);margin-bottom:16px" id="pxDesc"></div>
    <div style="display:flex;flex-direction:column;gap:10px;margin-bottom:20px">
      <label style="display:flex;align-items:flex-start;gap:10px;padding:12px;border:1.5px solid var(--border);border-radius:8px;cursor:pointer">
        <input type="radio" name="pxOpt" value="keep" checked style="margin-top:2px">
        <div><div style="font-size:13px;font-weight:600">只影響今後新記錄（推薦）</div>
        <div style="font-size:12px;color:var(--text2);margin-top:2px">過去已收款項維持原價</div></div>
      </label>
      <label style="display:flex;align-items:flex-start;gap:10px;padding:12px;border:1.5px solid var(--border);border-radius:8px;cursor:pointer">
        <input type="radio" name="pxOpt" value="all" style="margin-top:2px">
        <div><div style="font-size:13px;font-weight:600">所有月份按新單價重算</div></div>
      </label>
    </div>
    <div style="display:flex;gap:10px;justify-content:flex-end">
      <button class="btn btn-out" onclick="cancelPx()">取消</button>
      <button class="btn btn-blue" onclick="confirmPx()">確認</button>
    </div>
  </div>
</div>

<div id="toast" style="display:none;position:fixed;bottom:22px;right:22px;background:var(--blue);color:#fff;padding:11px 20px;border-radius:9px;font-size:13px;font-weight:500;z-index:9999;box-shadow:0 4px 16px rgba(0,0,0,.25)"></div>

<script>
// ── CONFIG ────────────────────────────────────────────────────
const CLIENTS={

function getUrl(){return localStorage.getItem('sunny_gas_url')||'';}

async function api(action,body={}){
  const url=getUrl();
  if(!url)throw new Error('未設定網址');
  if(action==='saveBatch'&&body.entries&&body.entries.length>20){
    const chunks=[];
    for(let i=0;i<body.entries.length;i+=20)chunks.push(body.entries.slice(i,i+20));
    let total=0;
    for(const chunk of chunks){const r=await api('saveBatch',{entries:chunk});total+=r.count||0;}
    return{ok:true,count:total};
  }
  const params=new URLSearchParams({action});
  for(const[k,v]of Object.entries(body)){
    const key=k==='entries'?'e':k==='prices'?'p':k==='entry'?'e':k==='ids'?'e':k;
    params.append(key,typeof v==='object'?JSON.stringify(v):String(v));
  }
  const fullUrl=url+'?'+params.toString();
  try{
    const res=await fetch(fullUrl,{redirect:'follow'});
    const data=JSON.parse(await res.text());
    if(data.error)throw new Error(data.error);
    return data;
  }catch(fe){
    return new Promise((resolve,reject)=>{
      const cb='cb_'+Date.now()+'_'+Math.random().toString(36).slice(2);
      window[cb]=(data)=>{
        delete window[cb];
        try{document.head.removeChild(sc);}catch(e){}
        if(data&&data.error)reject(new Error(data.error));else resolve(data);
      };
      const sc=document.createElement('script');
      sc.src=fullUrl+'&callback='+cb;
      sc.onerror=()=>{delete window[cb];try{document.head.removeChild(sc);}catch(e){}reject(new Error('連接失敗'));};
      setTimeout(()=>{if(window[cb]){delete window[cb];try{document.head.removeChild(sc);}catch(e){}reject(new Error('連接超時'));}},30000);
      document.head.appendChild(sc);
    });
  }
}

async function batchDel(btn){
  const fc=document.getElementById('filterClient').value;
  const fm=document.getElementById('filterMonth').value;
  if(!fc&&!fm){alert('請先選擇客戶或月份');return;}
  const toDelete=entries.filter(e=>{
    const d=(e.date||'').slice(0,10);
    if(fc&&e.clientKey!==fc)return false;
    if(fm&&!d.startsWith(fm))return false;
    return true;
  });
  if(!toDelete.length){alert('沒有符合條件的記錄');return;}
  if(!confirm('確定刪除 '+toDelete.length+' 條記錄？'))return;
  btn.textContent='刪除中...';btn.disabled=true;btn.style.opacity='0.5';
  const ids=toDelete.map(e=>String(e.id));
  try{
    try{await api('deleteBatch',{ids});}
    catch{
      for(let i=0;i<ids.length;i+=5){
        await Promise.all(ids.slice(i,i+5).map(id=>api('deleteEntry',{id}).catch(()=>{})));
        btn.textContent='刪除中... '+Math.min(i+5,ids.length)+'/'+ids.length;
      }
    }
    const s=new Set(ids);entries=entries.filter(e=>!s.has(String(e.id)));
    renderRecent();if(role==='boss'){renderSum();renderGen();}

// ── PRICES ────────────────────────────────────────────────────
function getPx(ck,month){
  const h=priceHistory[ck]||[];
  for(let i=h.length-1;i>=0;i--){const e=h[i];if(month>=e.from&&month<=e.to)return e.px;}
  return CLIENTS[ck].defPx;
}
function getCurPx(ck){const h=priceHistory[ck]||[];return h.length?[...h[h.length-1].px]:[...CLIENTS[ck].defPx];}
function prevM(m){const[y,mo]=m.split('-').map(Number);return mo===1?`${y-1}-12`:`${y}-${String(mo-1).padStart(2,'0')}`;}
function nextM(m){const[y,mo]=m.split('-').map(Number);return mo===12?`${y+1}-01`:`${y}-${String(mo+1).padStart(2,'0')}`;}

        <div style="display:flex;align-items:center;gap:8px"><span style="font-size:12px;color:var(--text2)">MOP$</span>
        <input class="px-inp" type="number" step="0.1" min="0" id="px_${ck}_${i}" value="${px[i]}"></div></div>`).join('');
    document.getElementById('priceList').appendChild(div);
  });
}
function savePx(ck,btn){
  const c=CLIENTS[ck];
  const cur=getCurPx(ck);
  const nw=c.cols.map((_,i)=>parseFloat(document.getElementById(`px_${ck}_${i}`).value)||0);

async function confirmPx(){

    const h=priceHistory[ck];if(h.length>0)h[h.length-1].to=prevM(from);

// ── SUMMARY & GENERATE ────────────────────────────────────────
function getE(month,ck){return entries.filter(e=>(e.date||'').slice(0,10).startsWith(month)&&e.clientKey===ck);}
// getEDedup: same as buildInv - one entry per day (latest wins), avoids duplicate inflation
function getEDedup(month,ck){
  const em={};
  getE(month,ck).forEach(e=>{em[(e.date||'').slice(0,10)]=e;});
  return Object.values(em);
}
// Store extra item prices set by boss: {itemName: price}
const extraPrices=JSON.parse(localStorage.getItem('sunny_extra_prices')||'{}');
function setExtraPx(name,month){
  const key='expx_'+name.replace(/[^a-zA-Z0-9]/g,'_');
  const val=parseFloat(document.getElementById(key)?.value)||0;
  if(!val){toast('請輸入單價');return;}
  extraPrices[name]=val;
  localStorage.setItem('sunny_extra_prices',JSON.stringify(extraPrices));
  toast('✓ 已設定「'+name+'」單價 MOP$ '+val);
  renderSum();renderGen();
}
function calcT(ck,month){
  const px=getPx(ck,month);
  return getEDedup(month,ck).reduce((s,e)=>{
    let total=e.qtys.reduce((ss,q,i)=>ss+q*(px[i]||0),0);
    // Add extras with boss-set prices
    if(e.extras)e.extras.forEach(x=>{
      if(extraPrices[x.name])total+=x.qty*extraPrices[x.name];
    });
    return s+total;
  },0);
}

function buildHTML(ck,month){

function buildCn(c,es,y,m,days,px){
  const em={};es.forEach(e=>em[(e.date||'').slice(0,10)]=e);
  let rows='',gt=0,extrasTotals={};

    }

  return `<div class="inv"><div class="invh"><div><div style="font-size:18px;font-weight:700">${CO}</div><div style="font-size:11px;opacity:.8;margin-top:3px">${CO_EN}</div></div><div style="text-align:right"><div style="font-size:16px;font-weight:700">${c.name}</div><div style="font-size:12px;opacity:.8;margin-top:2px">${y}年${parseInt(m)}月</div></div></div><div class="invb"><div style="overflow-x:auto"><table class="invt"><thead><tr><th>日期</th><th>貨單編號</th>${c.cols.map(col=>`<th style="text-align:right">${col}</th>`).join('')}<th style="text-align:right">總數量</th><th style="text-align:right">總價</th></tr></thead><tbody>${rows}</tbody></table></div>${extrasHtml}<div class="totbox"><span style="font-size:14px;font-weight:700">${y}年${parseInt(m)}月 合計</span><span style="font-size:22px;font-weight:700;color:var(--blue)">MOP$ ${gt.toFixed(0)}</span></div></div></div>`;
}
function buildInv(ck,c,es,y,m,days,px){

  const pay=c.pay?`<div style="margin-top:14px;padding:12px 16px;background:#F8F9FA;border-radius:6px;border:1px solid var(--border)"><div style="font-size:11px;font-weight:700;color:var(--text2);margin-bottom:6px">Payment Information / 付款資料</div><div style="font-size:11px;color:var(--text2);line-height:1.9">${BANK.replace(/\n/g,'<br>')}</div></div>`:'';

}

async function dedup(btn){
  const msg=document.getElementById('dedupMsg');

  [...entries].sort((a,b)=>Number(a.id)-Number(b.id)).forEach(e=>{

  });
  if(!ids.length){msg.textContent='✅ 沒有重複記錄';msg.style.color='var(--green)';btn.textContent='清除重複記錄';btn.disabled=false;btn.style.opacity='1';return;}
  msg.textContent='發現 '+ids.length+' 條重複，刪除中...';
  try{
    try{await api('deleteBatch',{ids});}
    catch{
      for(let i=0;i<ids.length;i+=5){
        await Promise.all(ids.slice(i,i+5).map(id=>api('deleteEntry',{id}).catch(()=>{})));
        btn.textContent='刪除中... '+Math.min(i+5,ids.length)+'/'+ids.length;

    toast('重複記錄已清除！');
  }catch(e){msg.textContent='❌ 失敗：'+e.message;msg.style.color='var(--red)';}
  btn.textContent='清除重複記錄';btn.disabled=false;btn.style.opacity='1';
}

// ── TOAST ─────────────────────────────────────────────────────
function toast(msg,dur=3000){
  const t=document.getElementById('toast');t.textContent=msg;t.style.display='block';
  clearTimeout(t._t);t._t=setTimeout(()=>t.style.display='none',dur);
}

// ── INIT ──────────────────────────────────────────────────────
(function(){
  const url=localStorage.getItem('sunny_gas_url');
  document.getElementById('loginWrap').style.display=url?'flex':'flex';
  if(!url){
    // Show setup hint
    document.getElementById('lerr').textContent='請先登入老闆帳號，在設定頁面輸入GAS網址';
    document.getElementById('lerr').style.color='#1565C0';
  }
})();
</script>
